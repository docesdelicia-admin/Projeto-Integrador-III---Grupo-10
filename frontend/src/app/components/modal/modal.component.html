<div *ngIf="aberto" class="modal-backdrop" role="presentation" (click)="aoClicarFora()">
  <section class="modal" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">

    <header class="modal-header modal-default-header" *ngIf="titulo || descricao">
      <h2>{{ titulo }}</h2>
      <p class="modal-subtitulo" *ngIf="descricao">{{ descricao }}</p>
    </header>

    <div class="modal-body">
      <ng-content></ng-content>
    </div>

    <footer class="modal-footer modal-default-footer" *ngIf="!temFooterProjetado">
      <ng-container *ngIf="(modoEdicao || acaoPrimariaLabel); else notEdicao">
        <button type="button" class="botao-secundario" (click)="cancelar.emit()">Cancelar</button>
        <button type="button" class="botao-principal" (click)="salvar.emit()">
          {{ acaoPrimariaLabel ?? 'Salvar' }}
        </button>
      </ng-container>
      <ng-template #notEdicao>
        <button *ngIf="mostrarBotaoEditar" type="button" class="botao-secundario"
          (click)="editar.emit()">Salvar</button>
        <button *ngIf="!mostrarBotaoEditar && mostrarBotaoFechar" type="button" class="botao-secundario"
          (click)="fechar.emit()">Fechar</button>
      </ng-template>
    </footer>

  </section>
</div>
