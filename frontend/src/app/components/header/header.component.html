<header class="app-header">
  <a class="brand" routerLink="/" aria-label="Doces Delícia — ir para a página inicial">
    <img class="brand-logo" src="/logo.png" alt="Logo Doces Delícia" />
    <div class="brand-info">
      <span class="brand-name">{{ titulo }}</span>
      <span class="brand-tagline">sabores que ficam na memória</span>
    </div>
  </a>
  <button class="hamburger" aria-label="Abrir menu" (click)="toggleSidebar()" [attr.aria-expanded]="false">
    <span class="hamburger-box">
      <span class="hamburger-inner"></span>
    </span>
  </button>
</header>
