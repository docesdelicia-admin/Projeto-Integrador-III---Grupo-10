<div *ngIf="sidebarService.aberto()" class="sidebar-overlay" (click)="sidebarService.close()" aria-hidden="true"></div>

<aside class="sidebar" [class.aberto]="sidebarService.aberto()" aria-label="Navegacao interna">
  <button class="btn-fechar" aria-label="Fechar menu" (click)="sidebarService.close()">✕</button>
  <p class="sidebar-titulo">{{ saudacaoUsuario }}</p>

  <nav>
    <ul>
      @for (item of itensVisiveis; track item.path) {
      <li>
        <a [routerLink]="item.path" routerLinkActive="ativo" [routerLinkActiveOptions]="{ exact: true }">
          {{ item.label }}
        </a>
      </li>
      }
    </ul>
  </nav>
</aside>
